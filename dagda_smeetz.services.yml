services:
  _defaults:
    autowire: true

  logger.channel.dagda_smeetz:
    parent: logger.channel_base
    arguments: ['dagda_smeetz']

  dagda_smeetz.urls:
    class: Drupal\dagda_smeetz\SmeetzUrls
  Drupal\dagda_smeetz\SmeetzUrlsInterface: '@dagda_smeetz.urls'

  dagda_smeetz.api_client:
    class: Drupal\dagda_smeetz\Api\SmeetzApiClient
  Drupal\dagda_smeetz\Api\SmeetzApiClientInterface: '@dagda_smeetz.api_client'

  dagda_smeetz.availability_sync:
    class: Drupal\dagda_smeetz\Sync\AvailabilitySync
  Drupal\dagda_smeetz\Sync\AvailabilitySyncInterface: '@dagda_smeetz.availability_sync'
