smeetz_ticketing.settings:
  type: config_object
  label: 'Smeetz settings'
  mapping:
    environment:
      type: string
      label: 'Environment'
      constraints:
        Choice:
          - test
          - live
    sync_interval:
      type: integer
      label: 'Availability sync interval, in minutes (0: off)'
      constraints:
        Range:
          min: 0
    group_id:
      type: string
      label: 'Group ID'
      constraints:
        Regex:
          pattern: '/^[0-9]*$/'
          message: 'The group ID is a number.'

field.storage_settings.smeetz_ticketing_ticket:
  type: mapping
  label: 'Smeetz ticket storage settings'

field.field_settings.smeetz_ticketing_ticket:
  type: mapping
  label: 'Smeetz ticket field settings'
  mapping:
    date_field:
      type: string
      label: 'Session date field'
    status_field:
      type: string
      label: 'List field kept in step with the availability'
    status_available:
      type: string
      label: 'Value when available'
    status_sold_out:
      type: string
      label: 'Value when sold out'

field.value.smeetz_ticketing_ticket:
  type: mapping
  label: 'Default value'
  mapping:
    product_id:
      type: string
      label: 'Product ID'
    option_uuid:
      type: string
      label: 'Option UUID'
    availability:
      type: string
      label: 'Availability'
    checked:
      type: integer
      label: 'Last check'

field.widget.settings.smeetz_ticketing_ticket:
  type: mapping
  label: 'Smeetz ticket widget settings'

field.formatter.settings.smeetz_ticketing_button:
  type: mapping
  label: 'Smeetz booking button settings'
  mapping:
    label:
      type: label
      label: 'Button label'
    date_field:
      type: string
      label: 'Date field passed to Smeetz'
    lightbox:
      type: boolean
      label: 'Open as an overlay'
    sold_out_label:
      type: label
      label: 'Label when sold out'
